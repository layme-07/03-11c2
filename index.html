<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarea 2 - Catálogo</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1 class="mb-4">Catálogo Tecnológico</h1>
  <div class="row g-3">

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div><span class="badge bg-success mb-2">En Stock</span></div>
          <h5 class="card-title">Mouse RGB 16k</h5>
          <p class="text-success fw-bold fs-4 mt-auto">$45.00</p>
          <button class="btn btn-primary w-100">Comprar</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div><span class="badge bg-success mb-2">En Stock</span></div>
          <h5 class="card-title">Teclado Mecánico</h5>
          <p class="text-success fw-bold fs-4 mt-auto">$85.00</p>
          <button class="btn btn-primary w-100">Comprar</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div><span class="badge bg-warning text-dark mb-2">Pocas Unidades</span></div>
          <h5 class="card-title">Audífonos 7.1</h5>
          <p class="text-success fw-bold fs-4 mt-auto">$65.00</p>
          <button class="btn btn-primary w-100">Comprar</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <div><span class="badge bg-danger mb-2">Agotado</span></div>
          <h5 class="card-title">Monitor 240Hz</h5>
          <p class="text-success fw-bold fs-4 mt-auto">$299.00</p>
          <button class="btn btn-secondary w-100" disabled>Sin Stock</button>
        </div>
      </div>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
